<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Control de Citas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body class="pb-5">

<header class="topbar py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <span id="bizName" class="fw-bold fs-4 display-font">Panel</span>
    <button class="btn btn-sm btn-outline-dark" id="logoutBtn" style="display:none;">Salir</button>
  </div>
</header>

<main class="container" style="max-width:900px;">

  <!-- LOGIN -->
  <div id="loginView" class="card-panel p-4 mx-auto" style="max-width:400px;">
    <h2 class="h5 fw-bold display-font mb-3">Iniciar sesión</h2>
    <label class="label-xs d-block mb-1">Correo</label>
    <input type="email" id="loginEmail" class="form-control mb-2">
    <label class="label-xs d-block mb-1">PIN</label>
    <input type="password" inputmode="numeric" id="loginPin" maxlength="8" class="form-control mb-3" style="letter-spacing:.4em;text-align:center;">
    <button class="btn btn-brand w-100" id="loginBtn">Entrar</button>
  </div>

  <!-- APP -->
  <div id="appView" style="display:none;">
    <ul class="nav nav-pills mb-4 flex-wrap gap-2" id="tabs">
      <li class="nav-item"><button class="btn btn-sm btn-outline-dark active" data-tab="agenda">Agenda</button></li>
      <li class="nav-item"><button class="btn btn-sm btn-outline-dark" data-tab="services">Servicios</button></li>
      <li class="nav-item"><button class="btn btn-sm btn-outline-dark" data-tab="specialists">Especialistas</button></li>
      <li class="nav-item"><button class="btn btn-sm btn-outline-dark" data-tab="spaces">Espacios</button></li>
      <li class="nav-item"><button class="btn btn-sm btn-outline-dark" data-tab="settings">Ajustes</button></li>
    </ul>

    <section id="tab-agenda">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <input type="date" id="agendaDate" class="form-control" style="max-width:200px;">
        <button class="btn btn-brand btn-sm" id="newApptBtn"><i class="bi bi-plus-lg"></i> Añadir cita</button>
      </div>
      <div id="agendaList" class="d-flex flex-column gap-2"></div>
    </section>

    <section id="tab-services" style="display:none;">
      <div class="card-panel p-4 mb-3">
        <h2 class="h6 fw-bold display-font mb-3">Añadir servicio</h2>
        <div class="row g-2">
          <div class="col-sm-4"><input class="form-control" id="svcName" placeholder="Nombre"></div>
          <div class="col-sm-2"><input type="number" class="form-control" id="svcDuration" placeholder="Min" value="30"></div>
          <div class="col-sm-2"><input type="number" class="form-control" id="svcPrice" placeholder="Precio" value="0"></div>
          <div class="col-sm-2"><input type="number" class="form-control" id="svcCancel" placeholder="Cancel. hrs" value="4"></div>
          <div class="col-sm-2"><input type="number" class="form-control" id="svcReminder" placeholder="Aviso hrs" value="12"></div>
        </div>
        <button class="btn btn-brand mt-2" id="addServiceBtn">Guardar</button>
      </div>
      <div id="servicesList" class="d-flex flex-column gap-2"></div>
    </section>

    <section id="tab-specialists" style="display:none;">
      <div class="card-panel p-4 mb-3">
        <h2 class="h6 fw-bold display-font mb-3">Añadir especialista</h2>
        <div class="row g-2">
          <div class="col-sm-4"><input class="form-control" id="spName" placeholder="Nombre"></div>
          <div class="col-sm-3"><input class="form-control" id="spRole" placeholder="Rol"></div>
          <div class="col-sm-2"><input class="form-control" id="spAvatar" placeholder="Iniciales" maxlength="2"></div>
          <div class="col-sm-2"><input type="color" class="form-control form-control-color" id="spColor" value="#0f5257"></div>
        </div>
        <button class="btn btn-brand mt-2" id="addSpecialistBtn">Guardar</button>
      </div>
      <div id="specialistsList" class="d-flex flex-column gap-2"></div>
    </section>

    <section id="tab-spaces" style="display:none;">
      <div class="card-panel p-4 mb-3">
        <h2 class="h6 fw-bold display-font mb-3">Añadir espacio</h2>
        <div class="row g-2">
          <div class="col-sm-4"><input class="form-control" id="spcLabel" placeholder="Nombre (ej. Mesa 1)"></div>
          <div class="col-sm-3">
            <select class="form-select" id="spcType"><option value="general">General</option><option value="barra">Barra</option><option value="privado">Privado</option><option value="terraza">Terraza</option></select>
          </div>
          <div class="col-sm-3">
            <select class="form-select" id="spcShape"><option value="square">Cuadrada</option><option value="rect-h">Rect. horizontal</option><option value="rect-v">Rect. vertical</option></select>
          </div>
          <div class="col-sm-2"><input type="number" class="form-control" id="spcCapacity" placeholder="Capacidad" value="2"></div>
        </div>
        <button class="btn btn-brand mt-2" id="addSpaceBtn">Guardar</button>
      </div>
      <div id="spacesList" class="d-flex flex-column gap-2"></div>
    </section>

    <section id="tab-settings" style="display:none;">
      <div class="card-panel p-4 mb-3">
        <h2 class="h6 fw-bold display-font mb-3">Horario del negocio</h2>
        <div class="row g-2 mb-3">
          <div class="col-sm-6"><label class="label-xs d-block mb-1">Apertura (hora)</label><input type="number" class="form-control" id="setOpenHour"></div>
          <div class="col-sm-6"><label class="label-xs d-block mb-1">Cierre (hora)</label><input type="number" class="form-control" id="setCloseHour"></div>
        </div>
        <button class="btn btn-brand btn-sm" id="saveSettingsBtn">Guardar horario</button>
      </div>
      <div class="card-panel p-4">
        <h2 class="h6 fw-bold display-font mb-3">Plantillas de mensajes (WhatsApp)</h2>
        <div id="templatesForm"></div>
      </div>
    </section>
  </div>
</main>

<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
