<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar cita</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<header class="topbar py-3 mb-4">
  <div class="container"><span id="bizName" class="fw-bold fs-4 display-font">Reservar cita</span></div>
</header>

<main class="container" style="max-width:560px;">
  <div id="noTenant" class="card-panel p-4 text-center" style="display:none;">
    <p class="text-muted mb-0">Esta página necesita el enlace de tu negocio, algo como <code>/t/tu-negocio</code>.</p>
  </div>

  <div id="bookingFlow" class="card-panel p-4">
    <div class="mb-3">
      <label class="label-xs d-block mb-1">Servicio</label>
      <select id="serviceSel" class="form-select"></select>
    </div>
    <div class="mb-3">
      <label class="label-xs d-block mb-1">Especialista</label>
      <select id="specialistSel" class="form-select"></select>
    </div>
    <div class="mb-3">
      <label class="label-xs d-block mb-1">Fecha</label>
      <input type="date" id="dateInput" class="form-control">
    </div>

    <div id="slotsWrap" class="mb-3">
      <label class="label-xs d-block mb-2">Horarios disponibles</label>
      <div id="slots" class="d-flex flex-wrap gap-2"></div>
    </div>

    <div id="clientForm" style="display:none;">
      <hr>
      <label class="label-xs d-block mb-1">Nombre completo</label>
      <input type="text" id="clientName" class="form-control mb-2">
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="label-xs d-block mb-1">Correo (opcional)</label>
          <input type="email" id="clientEmail" class="form-control">
        </div>
        <div class="col-6">
          <label class="label-xs d-block mb-1">Celular (para WhatsApp)</label>
          <input type="tel" id="clientPhone" class="form-control">
        </div>
      </div>
      <button class="btn btn-brand w-100" id="confirmBtn">Confirmar cita</button>
    </div>
  </div>

  <div id="doneScreen" class="card-panel p-4 text-center" style="display:none;">
    <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
    <h3 class="display-font fw-bold mt-2">¡Listo!</h3>
    <p class="text-muted">Tu cita quedó agendada. Te avisamos por WhatsApp si nos diste tu celular.</p>
  </div>
</main>

<script src="app.js"></script>
<script>
const { api, tenantSlug, toast } = window.CDC;
let business = null;
let selectedSlot = null;

async function init(){
  if (!tenantSlug()){ document.getElementById("noTenant").style.display = "block"; document.getElementById("bookingFlow").style.display = "none"; return; }
  business = await api("/public/business").catch((e) => { toast(e.message, false); return null; });
  if (!business) return;
  document.getElementById("bizName").textContent = business.name;
  document.getElementById("serviceSel").innerHTML = business.services.map(s => `<option value="${s.id}">${s.name} · ${s.duration_min} min</option>`).join("");
  document.getElementById("dateInput").value = new Date().toISOString().slice(0,10);
  renderSpecialists();
  document.getElementById("serviceSel").onchange = () => { renderSpecialists(); loadSlots(); };
  document.getElementById("specialistSel").onchange = loadSlots;
  document.getElementById("dateInput").onchange = loadSlots;
  document.getElementById("confirmBtn").onclick = confirmBooking;
  loadSlots();
}

function renderSpecialists(){
  const serviceId = document.getElementById("serviceSel").value;
  const ids = business.specialistsByService[serviceId] || business.specialists.map(s=>s.id);
  const list = business.specialists.filter(s => ids.includes(s.id));
  document.getElementById("specialistSel").innerHTML = (list.length ? list : business.specialists)
    .map(s => `<option value="${s.id}">${s.name}</option>`).join("");
}

async function loadSlots(){
  selectedSlot = null;
  document.getElementById("clientForm").style.display = "none";
  const serviceId = document.getElementById("serviceSel").value;
  const specialistId = document.getElementById("specialistSel").value;
  const date = document.getElementById("dateInput").value;
  if (!serviceId || !specialistId || !date) return;
  const { slots } = await api(`/public/availability?serviceId=${serviceId}&specialistId=${specialistId}&date=${date}`);
  const wrap = document.getElementById("slots");
  wrap.innerHTML = slots.length
    ? slots.map(s => `<button class="btn slot-btn" data-slot="${s}">${s}</button>`).join("")
    : `<p class="text-muted small mb-0">No hay horarios disponibles ese día.</p>`;
  wrap.querySelectorAll(".slot-btn").forEach(btn => btn.onclick = () => {
    wrap.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedSlot = btn.dataset.slot;
    document.getElementById("clientForm").style.display = "block";
  });
}

async function confirmBooking(){
  const clientName = document.getElementById("clientName").value.trim();
  if (!clientName || !selectedSlot) { toast("Escribe tu nombre y elige un horario.", false); return; }
  try {
    await api("/public/book", { method: "POST", body: {
      serviceId: document.getElementById("serviceSel").value,
      specialistId: document.getElementById("specialistSel").value,
      date: document.getElementById("dateInput").value,
      start: selectedSlot,
      clientName,
      clientEmail: document.getElementById("clientEmail").value.trim(),
      clientPhone: document.getElementById("clientPhone").value.trim(),
    }});
    document.getElementById("bookingFlow").style.display = "none";
    document.getElementById("doneScreen").style.display = "block";
  } catch (e) { toast(e.message, false); }
}

init();
</script>
</body>
</html>
