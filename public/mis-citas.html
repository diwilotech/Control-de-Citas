<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis citas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md" style="background:#0a3a3d;">
  <div class="container">
    <span class="navbar-brand d-flex align-items-center gap-2 text-white mb-0">
      <span class="navbar-brand-mark"><i class="bi bi-calendar2-heart"></i></span>
      <span class="fw-bold" id="bizName">Mis citas</span>
    </span>
  </div>
</nav>

<div class="container py-4 py-lg-5" style="max-width:640px;">

  <div id="noToken" class="card-panel p-4 text-center" style="display:none;">
    <p class="text-muted mb-0">Este link no es válido. Usa el que te mandamos por WhatsApp o correo al confirmar tu cita.</p>
  </div>

  <div id="okBanner" class="card-panel p-3 mb-3 text-center" style="display:none;background:#e6f4ec;border-color:#3a9a6d;">
    <i class="bi bi-check-circle-fill" style="color:#1e6b45;"></i> <strong>¡Tu cita quedó confirmada!</strong>
  </div>
  <div id="errBanner" class="card-panel p-3 mb-3 text-center" style="display:none;background:#f4e6e3;border-color:#c0472f;color:#8a3a26;"></div>

  <div id="listWrap" style="display:none;">
    <h1 class="h4 fw-bold display-font mb-3">Hola, <span id="clientName"></span></h1>
    <div id="apptList" class="d-flex flex-column gap-3"></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
const { api, toast } = window.CDC;

const STATUS_LABELS = { confirmed: "Confirmada", pending_confirmation: "Pendiente de confirmar", completed: "Completada", cancelled: "Cancelada", "no-show": "Inasistencia", reagendar: "Por reagendar" };
const STATUS_COLORS = { confirmed: "#0f5257", pending_confirmation: "#8a6d1f", completed: "#6b7570", cancelled: "#c0472f", "no-show": "#c0472f", reagendar: "#8a5a1f" };

function token() { return new URLSearchParams(location.search).get("t"); }

function formatDateHuman(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  return `${String(d).padStart(2, "0")} ${meses[m - 1]} ${y}`;
}
function formatAmPm(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const suffix = h < 12 ? "AM" : "PM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2, "0")} ${suffix}`;
}

function canAct(appt) {
  if (!["confirmed", "pending_confirmation", "reagendar"].includes(appt.status)) return false;
  if (appt.status === "reagendar") return true; // ya está marcada para cambiar, sin importar si su hora original ya pasó
  const startMs = new Date(`${appt.date}T${appt.start}:00`).getTime();
  return startMs - Date.now() >= (appt.cancel_window_hours || 0) * 3600000;
}

let apptsCache = [];
let business = null;
let reschedule = null; // { apptId, date, time }

function isDayClosed(iso) {
  const ex = (business.dateExceptions || []).find((e) => e.date === iso);
  if (ex) return !!ex.closed;
  const dow = new Date(iso + "T00:00:00").getDay();
  return !(business.openDays || [1, 2, 3, 4, 5, 6]).includes(dow);
}
function dayList() {
  const dows = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const base = new Date();
  return Array.from({ length: 10 }, (_, i) => {
    const d = new Date(base); d.setDate(base.getDate() + i);
    return { iso: d.toISOString().slice(0, 10), label: i === 0 ? "HOY" : dows[d.getDay()], num: d.getDate() };
  });
}

function reschedulePanel(appt) {
  if (!reschedule || reschedule.apptId !== appt.id) return "";
  const days = dayList();
  return `
    <div class="border-top mt-2 pt-2">
      <div class="d-flex flex-nowrap gap-2 mb-2 overflow-x-auto pb-1" id="rsDayStrip">
        ${days.map((d) => {
          const closed = isDayClosed(d.iso);
          return `<div class="day-chip ${reschedule.date === d.iso ? "selected" : ""} ${closed ? "closed" : ""}" data-iso="${d.iso}" style="flex-shrink:0;">
            <div class="dow">${d.label}</div><div class="dnum">${d.num}</div>${closed ? `<div class="dclosed">Cerrado</div>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="d-flex flex-wrap gap-2 mb-2" id="rsSlots"><p class="text-muted small mb-0">Elige un día.</p></div>
      <div class="d-flex gap-2">
        <button class="btn btn-brand btn-sm flex-fill" id="rsConfirmBtn" disabled>Confirmar nueva fecha</button>
        <button class="btn btn-outline-dark btn-sm" id="rsCancelBtn">Cancelar</button>
      </div>
    </div>`;
}

function apptCard(appt) {
  const actionable = canAct(appt);
  return `
    <div class="card-panel p-3" data-id="${appt.id}">
      <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
        <div>
          <div class="fw-bold">${appt.service_name}</div>
          <div class="text-muted small">${formatDateHuman(appt.date)} · ${formatAmPm(appt.start)} con ${appt.specialist_name}</div>
        </div>
        <span class="badge rounded-pill" style="background:${STATUS_COLORS[appt.status]}22;color:${STATUS_COLORS[appt.status]};">${STATUS_LABELS[appt.status] || appt.status}</span>
      </div>
      ${actionable ? `
        <div class="d-flex gap-2 mt-2">
          <button class="btn btn-sm btn-outline-dark" data-action="reschedule">Reagendar</button>
          <button class="btn btn-sm btn-outline-danger" data-action="cancel">Cancelar</button>
        </div>` : ""}
      ${reschedulePanel(appt)}
    </div>`;
}

async function loadRsSlots(appt) {
  const wrap = document.getElementById("rsSlots");
  const btn = document.getElementById("rsConfirmBtn");
  reschedule.time = null;
  btn.disabled = true;
  if (!reschedule.date || isDayClosed(reschedule.date)) { wrap.innerHTML = `<p class="text-muted small mb-0">Ese día está cerrado.</p>`; return; }
  wrap.innerHTML = `<p class="text-muted small mb-0">Cargando…</p>`;
  const { allSlots } = await api(`/public/my-appointments/${token()}/${appt.id}/reschedule-slots?date=${reschedule.date}`)
    .catch(() => ({ allSlots: [] }));
  // Se muestran también los horarios ocupados (en gris, deshabilitados) — no solo los libres —
  // para que se vea claro por qué algunos no se pueden elegir, en vez de que simplemente falten.
  wrap.innerHTML = allSlots.length ? allSlots.map((s) =>
    `<button class="btn slot-btn ${s.available ? "available" : "unavailable"}" data-slot="${s.time}" ${s.available ? "" : "disabled"}>${s.time}</button>`).join("")
    : `<p class="text-muted small mb-0">Sin horarios ese día.</p>`;
  wrap.querySelectorAll(".slot-btn:not(:disabled)").forEach((b) => b.onclick = () => {
    reschedule.time = b.dataset.slot;
    wrap.querySelectorAll(".slot-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    btn.disabled = false;
  });
}

function wireReschedulePanel(appt) {
  const strip = document.getElementById("rsDayStrip");
  if (!strip) return;
  strip.querySelectorAll(".day-chip:not(.closed)").forEach((el) => el.onclick = () => {
    reschedule.date = el.dataset.iso;
    render(); // re-renderiza el panel (día seleccionado) y dispara loadRsSlots al final
  });
  document.getElementById("rsCancelBtn").onclick = () => { reschedule = null; render(); };
  document.getElementById("rsConfirmBtn").onclick = async () => {
    if (!reschedule.date || !reschedule.time) return;
    try {
      await api(`/public/my-appointments/${token()}/${appt.id}/reschedule`, { method: "POST", body: { date: reschedule.date, start: reschedule.time } });
      toast("Listo, tu cita quedó reagendada.");
      reschedule = null;
      load();
    } catch (e) { toast(e.message, false); }
  };
  if (reschedule.date) loadRsSlots(appt);
}

function render() {
  const wrap = document.getElementById("apptList");
  if (!apptsCache.length) { wrap.innerHTML = `<p class="text-muted">Todavía no tienes citas.</p>`; return; }
  wrap.innerHTML = apptsCache.map(apptCard).join("");
  wrap.querySelectorAll("[data-action]").forEach((btn) => {
    const id = btn.closest("[data-id]").dataset.id;
    const action = btn.dataset.action;
    btn.onclick = () => action === "reschedule" ? (reschedule = { apptId: id, date: null, time: null }, render()) : act(id, action, "¿Seguro que quieres cancelar esta cita?");
  });
  if (reschedule) wireReschedulePanel(apptsCache.find((a) => a.id === reschedule.apptId));
}

async function act(apptId, action, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try {
    await api(`/public/my-appointments/${token()}/${apptId}/${action}`, { method: "POST" });
    toast("Cita cancelada.");
    load();
  } catch (e) { toast(e.message, false); }
}

async function load() {
  try {
    const [data] = await Promise.all([
      api(`/public/my-appointments/${token()}`),
      api(`/public/business`).then((b) => { business = b; }).catch(() => { business = { openDays: [1, 2, 3, 4, 5, 6], dateExceptions: [] }; }),
    ]);
    document.getElementById("bizName").textContent = data.business.name;
    document.getElementById("clientName").textContent = data.client.name;
    document.getElementById("listWrap").style.display = "block";
    apptsCache = data.appointments;
    render();
  } catch (e) {
    document.getElementById("noToken").style.display = "block";
  }
}

function init() {
  if (!token()) { document.getElementById("noToken").style.display = "block"; return; }
  const params = new URLSearchParams(location.search);
  if (params.get("justConfirmed")) document.getElementById("okBanner").style.display = "block";
  if (params.get("err")) {
    const msgs = { confirm: "Ese link de confirmación ya no es válido.", expired: "Ese link de confirmación ya venció." };
    const el = document.getElementById("errBanner");
    el.textContent = msgs[params.get("err")] || "Hubo un problema con el link.";
    el.style.display = "block";
  }
  load();
}
init();
</script>
</body>
</html>
