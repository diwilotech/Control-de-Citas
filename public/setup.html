<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super admin · Control de Citas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/styles.css" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width:900px;">

  <p id="bootStatus" class="text-center text-muted">Cargando…</p>

  <!-- Primer arranque: no existe super admin todavía -->
  <div id="registerView" class="card-panel p-4 mx-auto" style="display:none;max-width:460px;">
    <h1 class="h4 fw-bold display-font mb-1">Crear cuenta de super admin</h1>
    <p class="text-muted small mb-3">Es la primera vez que se usa el sistema. Esta cuenta es la
      única que puede crear negocios y administrar todos sus usuarios.</p>
    <label class="label-xs d-block mb-1">Tu nombre</label>
    <input class="form-control mb-2" id="adminName">
    <label class="label-xs d-block mb-1">Tu correo</label>
    <input type="email" class="form-control mb-2" id="adminEmail" value="yomar006">
    <label class="label-xs d-block mb-1">PIN (4-8 dígitos)</label>
    <input type="password" inputmode="numeric" maxlength="8" class="form-control mb-3" id="adminPin">
    <button class="btn btn-brand w-100" id="registerBtn">Crear cuenta de super admin</button>
  </div>

  <!-- Ya existe super admin, pero no hay sesión activa en este navegador -->
  <div id="loginView" class="card-panel p-4 mx-auto" style="display:none;max-width:460px;">
    <h1 class="h4 fw-bold display-font mb-3">Iniciar sesión</h1>
    <label class="label-xs d-block mb-1">Correo</label>
    <input type="email" class="form-control mb-2" id="loginEmail">
    <label class="label-xs d-block mb-1">PIN</label>
    <input type="password" inputmode="numeric" maxlength="8" class="form-control mb-3" id="loginPin">
    <button class="btn btn-brand w-100" id="loginBtn">Entrar</button>
  </div>

  <!-- Con sesión de super admin: negocios, sus usuarios y crear negocios nuevos -->
  <div id="businessView" style="display:none;">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h1 class="h4 fw-bold display-font mb-0">Panel de super admin</h1>
      <button class="btn btn-sm btn-outline-dark" id="logoutBtn">Salir</button>
    </div>

    <div class="card-panel p-4 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="h6 fw-bold display-font mb-0">Negocios</h2>
        <button class="btn btn-sm btn-brand" id="toggleCreateBtn" type="button">+ Nuevo negocio</button>
      </div>

      <div id="createForm" style="display:none;" class="border-top pt-3 mt-3">
        <label class="label-xs d-block mb-1">Nombre del negocio</label>
        <input class="form-control mb-2" id="businessName">
        <label class="label-xs d-block mb-1">Identificador en la URL (slug)</label>
        <input class="form-control mb-2" id="slug" placeholder="mi-negocio">
        <label class="label-xs d-block mb-1">Nombre del dueño</label>
        <input class="form-control mb-2" id="ownerName">
        <label class="label-xs d-block mb-1">Correo del dueño</label>
        <input type="email" class="form-control mb-2" id="ownerEmail">
        <label class="label-xs d-block mb-1">PIN del dueño (4-8 dígitos)</label>
        <input type="password" inputmode="numeric" maxlength="8" class="form-control mb-2" id="ownerPin">
        <label class="label-xs d-block mb-1">Celular del dueño (para avisos por WhatsApp)</label>
        <input type="tel" class="form-control mb-3" id="ownerPhone">
        <button class="btn btn-brand w-100" id="createBtn">Crear negocio</button>
      </div>

      <div id="businessList" class="d-flex flex-column gap-2 mt-3"></div>
    </div>

    <div id="businessDetail"></div>
  </div>

</main>
<script src="/app.js"></script>
<script>
try { // si algo de acá abajo revienta (p.ej. app.js no cargó), no se queda pegado en "Cargando…"

const { apiRoot, toast } = window.CDC;
if (typeof apiRoot !== "function") throw new Error("No cargó app.js. Revisa la consola (F12) o recarga con Ctrl+Shift+R.");

const views = ["registerView", "loginView", "businessView"];
function showView(id) {
  for (const v of views) document.getElementById(v).style.display = v === id ? "block" : "none";
}

async function boot() {
  try {
    const { hasAdmin } = await apiRoot("/admin/status");
    document.getElementById("bootStatus").style.display = "none";
    if (!hasAdmin) return showView("registerView");
    try {
      await apiRoot("/admin/me");
      showView("businessView");
      loadBusinesses();
    } catch {
      showView("loginView");
    }
  } catch (e) {
    document.getElementById("bootStatus").textContent =
      `No se pudo conectar con el servidor (${e.message}). Recarga la página.`;
  }
}
boot();

document.getElementById("registerBtn").onclick = async () => {
  const body = {
    name: document.getElementById("adminName").value.trim(),
    email: document.getElementById("adminEmail").value.trim(),
    pin: document.getElementById("adminPin").value.trim(),
  };
  if (!body.name || !body.email) return toast("Faltan tu nombre y correo.", false);
  try {
    await apiRoot("/admin/register", { method: "POST", body });
    showView("businessView");
    loadBusinesses();
  } catch (e) { toast(e.message, false); }
};

document.getElementById("loginBtn").onclick = async () => {
  const body = {
    email: document.getElementById("loginEmail").value.trim(),
    pin: document.getElementById("loginPin").value.trim(),
  };
  try {
    await apiRoot("/admin/login", { method: "POST", body });
    showView("businessView");
    loadBusinesses();
  } catch (e) { toast(e.message, false); }
};

document.getElementById("logoutBtn").onclick = async () => {
  await apiRoot("/admin/logout", { method: "POST" });
  document.getElementById("businessDetail").innerHTML = "";
  showView("loginView");
};

document.getElementById("toggleCreateBtn").onclick = () => {
  const el = document.getElementById("createForm");
  el.style.display = el.style.display === "none" ? "block" : "none";
};

document.getElementById("createBtn").onclick = async () => {
  const body = {
    businessName: document.getElementById("businessName").value.trim(),
    slug: document.getElementById("slug").value.trim().toLowerCase(),
    ownerName: document.getElementById("ownerName").value.trim(),
    ownerEmail: document.getElementById("ownerEmail").value.trim(),
    ownerPin: document.getElementById("ownerPin").value.trim(),
    ownerPhone: document.getElementById("ownerPhone").value.trim(),
  };
  try {
    await apiRoot("/setup", { method: "POST", body });
    for (const id of ["businessName", "slug", "ownerName", "ownerEmail", "ownerPin", "ownerPhone"]) {
      document.getElementById(id).value = "";
    }
    document.getElementById("createForm").style.display = "none";
    toast(`Negocio creado. Reservas: ${location.origin}/t/${body.slug}`);
    loadBusinesses();
  } catch (e) { toast(e.message, false); }
};

/* ---------- Lista de negocios + detalle (usuarios, servicios, especialistas) ---------- */

async function loadBusinesses() {
  const list = await apiRoot("/admin/businesses");
  document.getElementById("businessList").innerHTML = list.map((b) => `
    <div class="d-flex justify-content-between align-items-center border rounded p-2">
      <div>
        <strong>${b.name}</strong> <span class="text-muted small">/t/${b.slug}</span>
        ${b.whatsapp_enabled ? "" : '<span class="badge bg-secondary ms-2">WhatsApp desactivado</span>'}
      </div>
      <button class="btn btn-sm btn-outline-dark" data-id="${b.id}">Ver</button>
    </div>`).join("") || '<p class="text-muted small mb-0">Todavía no hay negocios.</p>';
  document.querySelectorAll("#businessList button[data-id]").forEach((btn) =>
    (btn.onclick = () => loadBusinessDetail(btn.dataset.id)));
}

async function loadBusinessDetail(id) {
  const { business, users, services, specialists } = await apiRoot(`/admin/businesses/${id}`);
  document.getElementById("businessDetail").innerHTML = `
    <div class="card-panel p-4">
      <h2 class="h6 fw-bold display-font mb-1">${business.name}</h2>
      <p class="text-muted small mb-2">/t/${business.slug} · WhatsApp ${business.whatsapp_enabled ? "activado" : "desactivado"}</p>
      <p class="mb-3">
        <a href="${location.origin}/t/${business.slug}" target="_blank">Reservas del cliente</a> ·
        <a href="${location.origin}/t/${business.slug}/admin" target="_blank">Panel del negocio</a>
      </p>

      <h3 class="label-xs mb-1">Servicios (${services.length})</h3>
      <p class="small mb-3">${services.map((s) => s.name).join(", ") || "Sin servicios todavía."}</p>

      <h3 class="label-xs mb-1">Especialistas (${specialists.length})</h3>
      <p class="small mb-3">${specialists.map((s) => s.name).join(", ") || "Sin especialistas todavía."}</p>

      <h3 class="label-xs mb-2">Usuarios</h3>
      <div id="detailUsers" class="d-flex flex-column gap-2 mb-3"></div>

      <h3 class="label-xs mb-2">Agregar usuario</h3>
      <div class="row g-2">
        <div class="col-sm-6"><input class="form-control" id="newUserName" placeholder="Nombre"></div>
        <div class="col-sm-6"><input type="email" class="form-control" id="newUserEmail" placeholder="Correo"></div>
        <div class="col-sm-6"><input type="password" inputmode="numeric" maxlength="8" class="form-control" id="newUserPin" placeholder="PIN"></div>
        <div class="col-sm-6">
          <select class="form-select" id="newUserRole">
            <option value="staff">Personal</option>
            <option value="owner">Dueño</option>
          </select>
        </div>
      </div>
      <button class="btn btn-brand btn-sm mt-2" id="addUserBtn">Agregar</button>
    </div>`;

  renderDetailUsers(business.id, users);

  document.getElementById("addUserBtn").onclick = async () => {
    const body = {
      name: document.getElementById("newUserName").value.trim(),
      email: document.getElementById("newUserEmail").value.trim(),
      pin: document.getElementById("newUserPin").value.trim(),
      role: document.getElementById("newUserRole").value,
    };
    if (!body.name || !body.email) return toast("Faltan nombre y correo.", false);
    try {
      await apiRoot(`/admin/businesses/${business.id}/users`, { method: "POST", body });
      loadBusinessDetail(business.id);
    } catch (e) { toast(e.message, false); }
  };
}

function renderDetailUsers(businessId, users) {
  document.getElementById("detailUsers").innerHTML = users.map((u) => `
    <div class="d-flex justify-content-between align-items-center border rounded p-2 flex-wrap gap-2">
      <div>
        <div>${u.name}</div>
        <div class="text-muted small">${u.email}${u.pin_hash ? "" : " · sin PIN"}</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <select class="form-select form-select-sm" style="width:auto;" data-role-id="${u.id}">
          <option value="staff" ${u.role === "staff" ? "selected" : ""}>Personal</option>
          <option value="owner" ${u.role === "owner" ? "selected" : ""}>Dueño</option>
        </select>
        <input type="password" inputmode="numeric" maxlength="8" placeholder="PIN nuevo" class="form-control form-control-sm" style="width:110px;" data-pin-input="${u.id}">
        <button class="btn btn-sm btn-outline-dark" data-pin-id="${u.id}" type="button">Fijar PIN</button>
      </div>
    </div>`).join("") || '<p class="text-muted small mb-0">Sin usuarios todavía.</p>';
  document.querySelectorAll("[data-role-id]").forEach((sel) => {
    sel.onchange = async () => {
      try {
        await apiRoot(`/admin/businesses/${businessId}/users/${sel.dataset.roleId}`, { method: "PATCH", body: { role: sel.value } });
        toast("Tipo de usuario actualizado.");
      } catch (e) { toast(e.message, false); }
    };
  });
  document.querySelectorAll("[data-pin-id]").forEach((btn) => {
    btn.onclick = async () => {
      const input = document.querySelector(`[data-pin-input="${btn.dataset.pinId}"]`);
      const pin = input.value.trim();
      if (!pin) return toast("Escribe el PIN nuevo.", false);
      try {
        await apiRoot(`/admin/businesses/${businessId}/users/${btn.dataset.pinId}`, { method: "PATCH", body: { pin } });
        toast("PIN actualizado.");
        loadBusinessDetail(businessId);
      } catch (e) { toast(e.message, false); }
    };
  });
}

} catch (e) {
  document.getElementById("bootStatus").textContent =
    `Error al iniciar la página (${e.message}). Recarga con Ctrl+Shift+R o prueba en una ventana privada.`;
}
</script>
</body>
</html>
